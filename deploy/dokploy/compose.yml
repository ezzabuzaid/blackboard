services:
  app:
    image: ${DEPLOY_IMAGE:?DEPLOY_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      CHATGPT_MODEL: ${CHATGPT_MODEL:-gpt-5.6-sol}
      HOME: /data/home
      PORT: "3001"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      WEB_ROOT: /app/apps/web/dist
      ZUKHRUF_DATA_DIR: /data/zukhruf
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  data:
    external: true
    name: baseera-data
