services:
  app:
    image: ${DEPLOY_IMAGE:?DEPLOY_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      sandbox-runner:
        condition: service_healthy
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DOCKER_HOST: tcp://sandbox-runner:2375
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
      HOME: /data/home
      PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      WEB_ROOT: /app/apps/web/dist
      ZUKHRUF_DATA_DIR: /data/zukhruf
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sandbox-runner:
    image: ${SANDBOX_IMAGE:?SANDBOX_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    privileged: true
    command:
      - --tls=false
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - data:/data
      - sandbox-runner-data:/var/lib/docker
    healthcheck:
      test:
        - CMD
        - docker
        - info
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  data:
    external: true
    name: baseera-data
  sandbox-runner-data:
